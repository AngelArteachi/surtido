name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Java build, unit and Testcontainers tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B verify

  web:
    name: Web app types and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  e2e:
    name: End to end on Docker Compose
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Start the platform
        run: docker compose up -d --build --wait
      - name: Smoke test through the gateway
        run: node scripts/smoke.mjs
      - name: Flash sale (200 stores, 80 scarce units)
        # Correctness thresholds stay strict; latency ones are relaxed for the shared runner.
        run: |
          chmod a+w loadtest/results
          docker compose --profile loadtest run --rm -e STORES=200 -e UNITS=80 -e PLACE_P95_MS=3000 -e PAY_P95_MS=3000 k6
      - name: Service logs
        if: failure()
        run: docker compose logs --tail 200
