server:
  port: 8080

spring:
  application:
    name: notifications
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/notifications}
    username: ${DATABASE_USER:surtido}
    password: ${DATABASE_PASSWORD:surtido}
    hikari:
      maximum-pool-size: 20
  flyway:
    locations: classpath:db/messaging,classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
  mvc:
    problemdetails:
      enabled: true

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

surtido:
  mail-from: "Surtido <pedidos@surtido.test>"
  # Share of emails that fail on purpose, to watch the retry topics work.
  mail-failure-rate: ${MAIL_FAILURE_RATE:0}

management.metrics.distribution.percentiles-histogram:
  http.server.requests: true
  orders.time_to_confirm: true
