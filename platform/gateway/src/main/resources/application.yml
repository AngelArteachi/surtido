server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          # Every route drops the /api prefix: /api/products/1 -> catalog /products/1.
          default-filters:
            - StripPrefix=1
          routes:
            - id: catalog
              uri: lb://catalog
              predicates:
                - Path=/api/products/**,/api/categories/**
            - id: orders
              uri: lb://orders
              predicates:
                - Path=/api/orders/**,/api/stores/**
            - id: payments
              uri: lb://payments
              predicates:
                - Path=/api/payments/**
            - id: shipping
              uri: lb://shipping
              predicates:
                - Path=/api/shipments/**
            - id: notifications
              uri: lb://notifications
              predicates:
                - Path=/api/notifications/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,gateway
  tracing:
    sampling:
      probability: 1.0
